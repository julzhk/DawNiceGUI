[project]
name = "daw-nicegui"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "mutagen>=1.48.1",
    "nicegui>=3.18.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
main_file = "main.py"
pythonpath = ["."]
